pre-commit:
  parallel: true
  commands:
    backend-format-check:
      glob: "server/**"
      run: just backend-format-check
    backend-typecheck:
      glob: "server/**"
      run: just backend-typecheck
    backend-architecture-lint:
      glob: "server/**"
      run: just backend-architecture-lint
    frontend-format-check:
      glob: "client-web/**"
      run: just frontend-format-check
    frontend-lint:
      glob: "client-web/**"
      run: just frontend-lint
    frontend-typecheck:
      glob: "client-web/**"
      run: just frontend-typecheck
