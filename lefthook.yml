pre-commit:
  parallel: true
  commands:
    skir-check:
      glob: "{lefthook.yml,justfile,skir-src/**}"
      run: just skir-check
    server-format-check:
      glob: "{lefthook.yml,justfile,skir-src/**,server/**}"
      run: just server::format-check
    server-type-check:
      glob: "{lefthook.yml,justfile,skir-src/**,server/**}"
      run: just server::type-check
    server-lint-check:
      glob: "{lefthook.yml,justfile,skir-src/**,server/**}"
      run: just server::lint-check
    server-test:
      glob: "{lefthook.yml,justfile,skir-src/**,server/**}"
      run: just server::test
    client-web-format-check:
      glob: "{lefthook.yml,justfile,skir-src/**,client-web/**}"
      run: just client-web::format-check
    client-web-type-check:
      glob: "{lefthook.yml,justfile,skir-src/**,client-web/**}"
      run: just client-web::type-check
    client-web-lint-check:
      glob: "{lefthook.yml,justfile,skir-src/**,client-web/**}"
      run: just client-web::lint-check
    client-test:
      glob: "{lefthook.yml,justfile,skir-src/**,client-web/**}"
      run: just client-web::test
