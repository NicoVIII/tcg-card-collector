name: CI Scaffold

on:
  workflow_dispatch:

jobs:
  scaffold-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Erlang/OTP + Gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "1.14.0"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Scaffold checks
        run: |
          chmod +x scripts/check_backend.sh scripts/check_frontend.sh scripts/check_all.sh server/linting/check_architecture.sh
          ./scripts/check_all.sh
