name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Erlang/OTP + Gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "1.14.0"

      - name: Run backend quality checks
        run: |
          chmod +x scripts/check_backend.sh server/linting/check_architecture.sh
          ./scripts/check_backend.sh

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Run frontend quality checks
        run: |
          chmod +x scripts/check_frontend.sh
          ./scripts/check_frontend.sh
