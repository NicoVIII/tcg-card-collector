name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

env:
  GLEAM_VERSION: "1.16.0"
  OTP_VERSION: "27"
  REBAR3_VERSION: "3"
  BUN_VERSION: "latest"

jobs:
  skir-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Just
        uses: extractions/setup-just@v3

      - name: Check skir
        run: just skir-check

  backend-quality:
    needs: [skir-validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Just
        uses: extractions/setup-just@v3

      - name: Setup Erlang/OTP + Gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          rebar3-version: ${{ env.REBAR3_VERSION }}
          gleam-version: ${{ env.GLEAM_VERSION }}

      - name: Cache Gleam dependencies
        uses: actions/cache@v5
        with:
          path: |
            server/build/packages
            server/build/dev/erlang
          key: ${{ runner.os }}-gleam-${{ env.OTP_VERSION }}-${{ env.GLEAM_VERSION }}-${{ hashFiles('server/manifest.toml') }}
          restore-keys: |
            ${{ runner.os }}-gleam-${{ env.OTP_VERSION }}-${{ env.GLEAM_VERSION }}-

      - name: Generate skir files
        run: just skir-gen

      - name: Setup server
        run: just server::setup

      - name: Check server
        run: just server::check

      - name: Test server
        run: just server::test

  frontend-quality:
    needs: [skir-validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Just
        uses: extractions/setup-just@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache client-web dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('client-web/package.json', 'client-web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Generate skir files
        run: just skir-gen

      - name: Setup client-web
        run: just client-web::setup

      - name: Check web client
        run: just client-web::check

      - name: Test web client
        run: just client-web::test
