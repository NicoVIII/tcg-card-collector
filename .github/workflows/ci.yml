name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  GLEAM_VERSION: "1.14.0"
  OTP_VERSION: "27"
  REBAR3_VERSION: "3"
  BUN_VERSION: "latest"

jobs:
  contract-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install just
        run: |
          sudo apt-get update
          sudo apt-get install -y just

      - name: Install dbmate
        run: sh ./scripts/install_dbmate.sh

      - name: Contract snapshot check
        run: just contract-snapshot-check

      - name: Contract alignment check
        run: |
          just contract-alignment-check

  backend-quality:
    needs: [contract-validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Erlang/OTP + Gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          gleam-version: ${{ env.GLEAM_VERSION }}
          rebar3-version: ${{ env.REBAR3_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install just
        run: |
          sudo apt-get update
          sudo apt-get install -y just

      - name: Cache Gleam dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/gleam
            server/build/packages
          key: ${{ runner.os }}-gleam-${{ env.OTP_VERSION }}-${{ env.GLEAM_VERSION }}-${{ hashFiles('server/manifest.toml') }}
          restore-keys: |
            ${{ runner.os }}-gleam-${{ env.OTP_VERSION }}-${{ env.GLEAM_VERSION }}-

      - name: Backend format check
        run: just backend-format-check

      - name: Backend typecheck
        run: just backend-typecheck

      - name: Apply database migrations
        run: just db-migrate

      - name: Backend tests
        run: just backend-test

      - name: Backend storage smoke
        run: just storage-smoke-check

      - name: Backend architecture lint
        run: just backend-architecture-lint

  frontend-quality:
    needs: [contract-validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install just
        run: |
          sudo apt-get update
          sudo apt-get install -y just

      - name: Cache client-web dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('client-web/package.json', 'client-web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Frontend format check
        run: just frontend-format-check

      - name: Frontend lint
        run: just frontend-lint

      - name: Frontend typecheck
        run: just frontend-typecheck

      - name: Frontend tests
        run: just frontend-test
