name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

env:
  GLEAM_VERSION: "1.18.1"
  OTP_VERSION: "27"
  REBAR3_VERSION: "3"
  BUN_VERSION: "latest"

jobs:
  skir-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Just
        uses: extractions/setup-just@v4

      - name: Check skir
        run: just skir-check

  backend-quality:
    needs: [skir-validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Just
        uses: extractions/setup-just@v4

      - name: Setup Erlang/OTP + Gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          rebar3-version: ${{ env.REBAR3_VERSION }}
          gleam-version: ${{ env.GLEAM_VERSION }}

      - name: Cache Gleam dependencies
        uses: actions/cache@v6
        with:
          path: |
            server/build/packages
            server/build/dev/erlang
          key: ${{ runner.os }}-gleam-${{ env.OTP_VERSION }}-${{ env.GLEAM_VERSION }}-${{ hashFiles('server/manifest.toml') }}
          restore-keys: |
            ${{ runner.os }}-gleam-${{ env.OTP_VERSION }}-${{ env.GLEAM_VERSION }}-

      - name: Generate skir files
        run: just skir-gen

      - name: Setup server
        run: just server::setup

      - name: Check server
        run: just server::check

      - name: Test server
        run: just server::test

  frontend-quality:
    needs: [skir-validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Just
        uses: extractions/setup-just@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache client-web dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('client-web/package.json', 'client-web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Generate skir files
        run: just skir-gen

      - name: Setup client-web
        run: just client-web::setup

      - name: Check web client
        run: just client-web::check

      - name: Test web client
        run: just client-web::test

  build-and-push:
    needs: [skir-validate, backend-quality, frontend-quality]
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A release tag published with a stale server/gleam.toml would ship an
      # image labelled e.g. 0.2.0 that reports 0.1.0 over REST/Skir — the one
      # hazard the single-source-of-truth model doesn't already rule out.
      - name: Verify tag matches server/gleam.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          toml_version="$(grep -m1 '^version = ' server/gleam.toml | sed -E 's/version = "(.*)"/\1/')"
          if [ "$tag_version" != "$toml_version" ]; then
            echo "::error::Tag v$tag_version does not match server/gleam.toml version $toml_version"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/nicoviii/tcg-card-collector
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_CHANNEL=${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'dev' }}
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
