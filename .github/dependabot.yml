version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/client-web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      client-web-linting:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@typescript-eslint/*"
          - "oxlint"
          - "oxfmt"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"

