services:
  app:
    image: ghcr.io/nicoviii/tcg-card-collector:main
    ports:
      - "8000:80"
    volumes:
      - db_data:/data
    environment:
      DATABASE_PATH: /data/tcg_card_collector.db
      SECRET_KEY_BASE: replace-with-a-long-random-secret
    restart: unless-stopped

volumes:
  db_data:
