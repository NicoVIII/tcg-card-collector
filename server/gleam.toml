name = "tcg_card_collector"
version = "0.1.0"

target = "erlang"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
mist = ">= 6.0.2 and < 7.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
skir_client = ">= 1.0.5 and < 2.0.0"
simplifile = ">= 2.4.0 and < 3.0.0"
gleam_time = ">= 1.8.0 and < 2.0.0"
sqlight = ">= 1.1.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
glinter = ">= 2.19.0 and < 3.0.0"
gleam_otp = ">= 1.2.0 and < 2.0.0"
glinter_arch = { path = "./vendor/gleam-libs/packages/glinter_arch" }

[tools.glinter]
exclude = ["src/bootstrap/skir/skirout/"] # skip generated files entirely

[tools.glinter.rules]
depends_only_on = "error"
